# @see https://mise.jdx.dev/configuration.html#global-config
[tools]
node = "24.21.0"
python = "3.13"
terraform = "1.16"
terragrunt = "1.1.6"
jq = "1.8.2"
conftest = "0.71.1"
shellcheck = "0.11.0"
bats = "1.14.0"
go = "1.27"
rust = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
trusted_config_paths = ["~/workspace"]

[settings.status]
show_env = false
show_tools = false