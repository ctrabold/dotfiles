# @see https://mise.jdx.dev/configuration.html#global-config
[tools]
actionlint = "latest"
action-validator = "0.9.0"
adr-tools = "latest"
bat = "0.26.1"
bats = "1.14.0"
conftest = "0.71.1"
dependency-check = "13.0.0"
go = "1.27"
hadolint = "2.15.1"
hugo = "0.169.0"
imagemagick = "7.1.2_31"
jq = "1.8.2"
mkcert = "latest"
node = "24.21.0"
pre-commit = "4.7.0"
prettier = "latest"
python = "3.13"
ruby = "latest"
rust = "latest"
semgrep = "1.183.0"
shellcheck = "0.11.0"
terraform = "1.16.4"
terragrunt = "1.1.6"
tflint = "0.65.0"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
trusted_config_paths = ["~/workspace"]

[settings.status]
show_env = false
show_tools = false
